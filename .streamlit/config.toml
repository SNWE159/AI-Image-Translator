# .streamlit/config.toml
# Streamlit Community Cloud configuration

[server]
# Streamlit Cloud manages the port; leave as default
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base             = "dark"
backgroundColor  = "#0a0e1a"
secondaryBackgroundColor = "#111827"
primaryColor     = "#00e5ff"
textColor        = "#e2e8f0"
font             = "sans serif"

[runner]
# Prevents "ScriptRunContext" warnings in logs
fastReruns = true
